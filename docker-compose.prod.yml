name: medicore-production

services:
  # Reverse Proxy & Security Gateway (MC-14)
  gateway:
    image: nginx:alpine
    container_name: medicore-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - medicore-public

  postgres:
    image: postgres:16-alpine
    container_name: medicore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - medicore-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medicore-redis
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    networks:
      - medicore-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: medicore-backend:latest
    container_name: medicore-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost
      ANALYTICS_SERVICE_URL: http://analytics:8002
      ANALYTICS_SHARED_SECRET: ${ANALYTICS_SHARED_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medicore-internal
      - medicore-public
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:4002/api/v1/health/live\", (res) => process.exit(res.statusCode === 200 ? 0 : 1))'"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: medicore-frontend:latest
    container_name: medicore-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: /api/v1
    networks:
      - medicore-public
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3002/login\", (res) => process.exit(res.statusCode < 500 ? 0 : 1))'"]
      interval: 15s
      timeout: 5s
      retries: 3

  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    image: medicore-analytics:latest
    container_name: medicore-analytics
    restart: unless-stopped
    environment:
      PORT: 8002
      BACKEND_API_URL: http://backend:4002/api/v1
      ANALYTICS_SHARED_SECRET: ${ANALYTICS_SHARED_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medicore-internal
      - medicore-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  notification-worker:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    image: medicore-notification-worker:latest
    container_name: medicore-notification-worker
    restart: unless-stopped
    command: ["python", "-m", "analytics.worker_daemon"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANALYTICS_SHARED_SECRET: ${ANALYTICS_SHARED_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medicore-internal

volumes:
  postgres_prod_data:
    name: medicore_prod_postgres_data
  redis_prod_data:
    name: medicore_prod_redis_data

networks:
  medicore-internal:
    driver: bridge
    internal: true
  medicore-public:
    driver: bridge
