name: medicore-platform

services:
  # Isolated Clinical Relational Database (MC-03)
  postgres:
    image: postgres:16-alpine
    container_name: medicore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicore_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-medicore_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medicore-internal
    # Database kept private within internal network; not exposed to host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicore_user} -d ${POSTGRES_DB:-medicore_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # In-memory Caching and Session Store
  redis:
    image: redis:7-alpine
    container_name: medicore-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - medicore-internal
    # Redis kept private within internal network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hospital Backend API (MC-02, MC-04, MC-09)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: medicore-backend:latest
    container_name: medicore-backend
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicore_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medicore_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3002,http://localhost:8088}
      ANALYTICS_SERVICE_URL: http://analytics:8002
      ANALYTICS_SHARED_SECRET: ${ANALYTICS_SHARED_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medicore-internal
      - medicore-public
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:4002/api/v1/health/live\", (res) => process.exit(res.statusCode === 200 ? 0 : 1))'"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Web Frontend (Port 3002 - Batch 2 Target)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: medicore-frontend:latest
    container_name: medicore-frontend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    networks:
      - medicore-public
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3002/login\", (res) => process.exit(res.statusCode < 500 ? 0 : 1))'"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Clinical Analytics Service (Port 8002 - Batch 3)
  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    image: medicore-analytics:latest
    container_name: medicore-analytics
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      BACKEND_API_URL: http://backend:4002/api/v1
      ANALYTICS_SHARED_SECRET: ${ANALYTICS_SHARED_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medicore-internal
      - medicore-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Dedicated Asynchronous Notification Worker Service (MC-09)
  notification-worker:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    image: medicore-notification-worker:latest
    container_name: medicore-notification-worker
    restart: unless-stopped
    command: ["python", "-m", "analytics.worker_daemon"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANALYTICS_SHARED_SECRET: ${ANALYTICS_SHARED_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medicore-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import time, os; t=float(open(\"/tmp/worker_healthy\").read().strip()); exit(0 if time.time()-t < 30 else 1)'"]
      interval: 20s
      timeout: 5s
      retries: 3

  # Lightweight Demonstration Gateway (Port 8088 - MC-14 Same-Origin Tunnel Gateway)
  gateway:
    image: nginx:alpine
    container_name: medicore-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - medicore-public

volumes:
  postgres_data:
    name: medicore_postgres_data
  redis_data:
    name: medicore_redis_data

networks:
  medicore-internal:
    driver: bridge
    internal: true
  medicore-public:
    driver: bridge
