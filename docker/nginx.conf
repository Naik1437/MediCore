events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # Upstream Services
    upstream frontend_upstream {
        server frontend:3002;
    }

    upstream backend_upstream {
        server backend:4002;
    }

    upstream analytics_upstream {
        server analytics:8002;
    }

    server {
        listen 80;
        server_name hospital.medicore.local localhost;

        # Health endpoint
        location /healthz {
            return 200 '{"status":"proxy_healthy"}';
            add_header Content-Type application/json;
        }

        # Frontend Application
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend APIs
        location /api/v1/ {
            proxy_pass http://backend_upstream/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Analytics Internal Proxy
        location /analytics/ {
            proxy_pass http://analytics_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
