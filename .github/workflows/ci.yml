name: MediCore Enterprise CI Pipeline (MC-11)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  static-analysis-and-audit:
    name: Static Analysis, Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dependency Audit
        run: |
          npm audit --audit-level=high || true

      - name: Secret Scanning (TruffleHog / GitLeaks pattern check)
        run: |
          echo "Scanning codebase for exposed credentials..."
          ! grep -rn "BEGIN RSA PRIVATE KEY" . --exclude-dir=.git || exit 1

  backend-verification:
    name: Backend Compilation, Migrations & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medicore_user
          POSTGRES_PASSWORD: medicore_secure_pass_2026
          POSTGRES_DB: medicore_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Prisma Client Generation & Migration Verification
        env:
          DATABASE_URL: postgresql://medicore_user:medicore_secure_pass_2026@localhost:5432/medicore_db?schema=public
        run: |
          npm --prefix backend run prisma:generate
          npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Compile Backend TypeScript
        run: npm --prefix backend run build

      - name: Run Backend Integration & Security Tests
        env:
          DATABASE_URL: postgresql://medicore_user:medicore_secure_pass_2026@localhost:5432/medicore_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key-medicore-super-secure-32bytesmin
        run: npm --prefix backend test

  frontend-verification:
    name: Frontend Build & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Frontend Unit & Component Tests
        run: npm --prefix frontend test

      - name: Build Next.js Production Bundle
        run: npm --prefix frontend run build

  analytics-verification:
    name: Python Analytics & Data Processing Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: analytics/requirements.txt

      - name: Install Analytics Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analytics/requirements.txt

      - name: Run Pytest Suite (MC-05, MC-06, MC-08)
        run: python -m pytest analytics/tests -v
