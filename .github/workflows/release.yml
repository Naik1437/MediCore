name: MediCore Staging & Release Deployment (MC-11)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  container-builds:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Image
        run: docker build -t medicore-backend:${{ github.sha }} -f backend/Dockerfile .

      - name: Build Frontend Image
        run: docker build -t medicore-frontend:${{ github.sha }} -f frontend/Dockerfile .

      - name: Build Analytics Image
        run: docker build -t medicore-analytics:${{ github.sha }} -f analytics/Dockerfile .

  deploy-staging:
    name: Deploy to Staging Cluster
    needs: [container-builds]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Staging Rollout
        run: echo "Deploying commit ${{ github.sha }} to private staging environment with zero external cost."

  deploy-production:
    name: Approval-Controlled Production Release
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      # Requires manual review approval configured in GitHub Environment settings
    steps:
      - name: Production Zero-Downtime Rollout
        run: |
          echo "Production deployment approved by Clinical Leads and Security Officers."
          echo "Rolling out version ${{ github.ref_name }}..."
